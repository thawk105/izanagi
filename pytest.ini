# 収集集合を checkout 非依存にするための最小設定 (F41 の射程拡大 / T-129)。
#
# addopts は書かない。tools/run_tests.py の 4 ゲート
# (_is_full_suite:314 / _has_no_execution_flag:375 / _has_dispatch_exempt_flag:390 /
# _is_acceptance_run:403) はいずれも環境変数 PYTEST_ADDOPTS しか読まず、ini の
# addopts を構造的に見ない。ここに addopts を置くと「全走のつもりで実は選択走」が
# preflight を素通りする (規律 2)。filterwarnings / xfail_strict も赤の有無を
# 変えるため置かない。キーを増やす改訂は 4 ゲートに対する再裁定を要する。
#
# norecursedirs は pytest 既定を置換するので、既定 (pytest 9.1.1) を明示再掲した
# うえで output external を足す。.* を落とすと .claude/worktrees/ が収集対象へ戻る。
[pytest]
testpaths = orchestrator/tests
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} output external
